version: '3.8'

services:
  eureka-server:
    image: nexusbank/eureka-server:latest
    ports:
      - "8761:8761"
    environment:
      - EUREKA_USERNAME=admin
      - EUREKA_PASSWORD=${EUREKA_PASSWORD}
    networks:
      - nexusbank-network
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  config-server:
    image: nexusbank/config-server:latest
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
    networks:
      - nexusbank-network
    deploy:
      replicas: 1

  api-gateway:
    image: nexusbank/api-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      - config-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
    networks:
      - nexusbank-network
    deploy:
      replicas: 2

  customer-service:
    image: nexusbank/customer-service:latest
    ports:
      - "8081:8081"
    depends_on:
      - config-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
    networks:
      - nexusbank-network
    deploy:
      replicas: 2

  admin-service:
    image: nexusbank/admin-service:latest
    ports:
      - "8082:8082"
    depends_on:
      - customer-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
    networks:
      - nexusbank-network
    deploy:
      replicas: 2

  frontend:
    image: nexusbank/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - nexusbank-network
    deploy:
      replicas: 2

networks:
  nexusbank-network:
    driver: overlay
    attachable: true
